<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรไฟล์ของฉัน</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
</head>
<body class="bg-gradient-to-br from-purple-100 via-blue-100 to-pink-100 min-h-screen">
  <script src="components/navbar.js"></script>
  
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    <!-- Header Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 mb-6 transform hover:scale-105 transition duration-300">
      <div class="flex items-center gap-3 mb-3">
        <div class="bg-gradient-to-r from-blue-500 to-cyan-500 rounded-full p-3">
          <span class="text-4xl">👤</span>
        </div>
        <div>
          <h2 class="text-3xl font-bold text-gray-800">โปรไฟล์ของฉัน</h2>
          <p class="text-gray-600 mt-1">ข้อมูลส่วนตัวของคุณ</p>
        </div>
      </div>
    </div>

    <!-- Profile Info Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 mb-6">
      <div class="space-y-6">
        <!-- Name -->
        <div class="border-b border-gray-200 pb-4">
          <div class="flex items-center gap-3 mb-2">
            <span class="text-2xl">📛</span>
            <label class="text-sm font-medium text-gray-500 uppercase tracking-wide">ชื่อ</label>
          </div>
          <p id="name" class="text-xl font-semibold text-gray-800 ml-9">-</p>
        </div>

        <!-- Email -->
        <div class="border-b border-gray-200 pb-4">
          <div class="flex items-center gap-3 mb-2">
            <span class="text-2xl">📧</span>
            <label class="text-sm font-medium text-gray-500 uppercase tracking-wide">อีเมล</label>
          </div>
          <p id="email" class="text-xl font-semibold text-gray-800 ml-9">-</p>
        </div>

        <!-- Role -->
        <div class="pb-2">
          <div class="flex items-center gap-3 mb-2">
            <span class="text-2xl">🎭</span>
            <label class="text-sm font-medium text-gray-500 uppercase tracking-wide">บทบาท</label>
          </div>
          <div class="ml-9">
            <span id="role" class="inline-block bg-gradient-to-r from-purple-500 to-blue-500 text-white px-4 py-2 rounded-lg font-semibold">user</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Action Buttons Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <a 
          href="index.html"
          class="bg-gradient-to-r from-purple-500 to-blue-600 hover:from-purple-600 hover:to-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 shadow-lg text-center flex items-center justify-center gap-2 transform hover:scale-105">
          <span>🎸</span>
          <span>ไปจองห้อง</span>
        </a>
        <a 
          href="mybookings.html"
          class="bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 shadow-lg text-center flex items-center justify-center gap-2 transform hover:scale-105">
          <span>📋</span>
          <span>ดูการจองของฉัน</span>
        </a>
      </div>
      <button 
        onclick="logout()"
        class="w-full mt-4 bg-gradient-to-r from-red-500 to-pink-600 hover:from-red-600 hover:to-pink-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 shadow-lg transform hover:scale-105">
        ออกจากระบบ
      </button>
    </div>
  </div>

  <style>
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container > div {
      animation: fadeInUp 0.6s ease-out;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Get user data from memory storage (replacing localStorage)
      const name = window.userData?.name || localStorage.getItem("name") || "-";
      const email = window.userData?.email || localStorage.getItem("email") || "-";
      const role = window.userData?.role || localStorage.getItem("role") || "user";

      document.getElementById("name").textContent = name;
      document.getElementById("email").textContent = email;
      document.getElementById("role").textContent = role;
    });

    function logout() {
      // Clear user data
      if (window.userData) {
        window.userData = null;
      }
      localStorage.clear();
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
