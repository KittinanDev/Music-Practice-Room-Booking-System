<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-blue-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Main Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 transform hover:scale-105 transition duration-300">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-block bg-gradient-to-r from-pink-500 to-purple-500 rounded-full p-4 mb-4">
          <span class="text-5xl">📝</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-800 mb-2">สมัครสมาชิก</h2>
        <p class="text-gray-600">เริ่มต้นจองห้องซ้อมดนตรี</p>
      </div>

      <!-- Register Form -->
      <form id="register-form" class="space-y-6">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
            👤 ชื่อผู้ใช้
          </label>
          <input 
            type="text" 
            name="name" 
            id="name"
            placeholder="ชื่อ-นามสกุล" 
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 placeholder-gray-400"
          >
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            📧 อีเมล
          </label>
          <input 
            type="email" 
            name="email" 
            id="email"
            placeholder="your@email.com" 
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 placeholder-gray-400"
          >
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            🔒 รหัสผ่าน
          </label>
          <input 
            type="password" 
            name="password" 
            id="password"
            placeholder="••••••••" 
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 placeholder-gray-400"
          >
        </div>

        <button 
          type="submit"
          class="w-full bg-gradient-to-r from-pink-600 to-purple-600 text-white font-semibold py-3 px-6 rounded-lg hover:from-pink-700 hover:to-purple-700 transform hover:scale-105 transition duration-200 shadow-lg flex items-center justify-center"
        >
          <span id="btn-text">สมัครสมาชิก</span>
          <div id="loader" class="loader hidden ml-2">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </div>
        </button>
      </form>

      <!-- Footer -->
      <div class="mt-6 text-center">
        <p class="text-gray-600">
          มีบัญชีอยู่แล้ว? 
          <a href="login.html" class="text-purple-600 hover:text-purple-700 font-semibold hover:underline transition duration-200">
            เข้าสู่ระบบ
          </a>
        </p>
      </div>
    </div>

    <!-- Additional Info -->
    <div class="text-center mt-6">
      <p class="text-gray-600 text-sm">
        🎸 สมัครฟรี ไม่มีค่าใช้จ่าย
      </p>
    </div>
  </div>

  <style>
    /* Custom animation for card entrance */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container > div {
      animation: fadeInUp 0.6s ease-out;
    }
  </style>
</body>
</html>
