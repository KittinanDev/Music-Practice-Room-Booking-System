<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Admin - ระบบจองห้องซ้อมดนตรี</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>🎛️ Admin Dashboard</h1>
    <nav>
      <button onclick="window.location='index.html'">หน้าแรก</button>
      <button onclick="logout()">ออกจากระบบ</button>
    </nav>
  </header>

  <section>
    <h2>📅 รายการจองทั้งหมด</h2>
    <div id="admin-bookings"></div>
  </section>

  <section>
    <h2>🏠 จัดการห้องซ้อม</h2>
    <form id="room-form">
      <input type="text" id="room-name" placeholder="ชื่อห้องใหม่" required>
      <input type="number" id="room-capacity" placeholder="ความจุ" min="1" required>
      <input type="text" id="room-equipment" placeholder="อุปกรณ์ (คั่นด้วย ,)" required>
      <button type="submit">เพิ่มห้อง</button>
    </form>
    <div id="room-list-admin"></div>
  </section>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/booking.js"></script>
<script>
  showUserBanner();   // ✅ แสดงชื่อผู้ใช้เมื่อโหลดหน้า
  loadRooms();
  setupAvailabilityChecker();
</script>

</body>
</html>
