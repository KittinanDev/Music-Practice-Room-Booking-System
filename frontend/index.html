<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>จองห้องซ้อมดนตรี</title>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/booking.js"></script>
</head>
<body>
   <div id="navbar-container"></div>
  <h2>🎸 จองห้องซ้อมดนตรี</h2>
  <p>สวัสดีคุณ <span id="username"></span></p>

  <form id="booking-form">
    <label>วันที่:</label>
    <input type="date" id="date" required><br>
    <label>เวลาเริ่ม:</label>
    <input type="time" id="start" required><br>
    <label>เวลาสิ้นสุด:</label>
    <input type="time" id="end" required><br>
    <button type="submit">จอง</button>
  </form>

  <p id="msg"></p>
  <hr>

  <p><a href="mybookings.html">ดูการจองของฉัน</a></p>
  <p><button onclick="logout()">ออกจากระบบ</button></p>
</body>
</html>
