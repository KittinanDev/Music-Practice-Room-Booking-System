<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองห้องซ้อมดนตรี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/booking.js"></script>
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-lg p-8 mb-6">
      <div class="flex items-center justify-center mb-6">
        <span class="text-5xl mr-3">🎵</span>
        <h2 class="text-3xl font-bold text-gray-800">จองห้องซ้อมดนตรี</h2>
      </div>

      <!-- Booking Form -->
      <form id="booking-form" class="space-y-6">
        <div>
          <label for="date" class="block text-sm font-medium text-gray-700 mb-2">
            📅 วันที่
          </label>
          <input 
            type="date" 
            id="date" 
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
          >
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="start" class="block text-sm font-medium text-gray-700 mb-2">
              🕐 เวลาเริ่ม
            </label>
            <input 
              type="time" 
              id="start" 
              required
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
            >
          </div>

          <div>
            <label for="end" class="block text-sm font-medium text-gray-700 mb-2">
              🕐 เวลาสิ้นสุด
            </label>
            <input 
              type="time" 
              id="end" 
              required
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
            >
          </div>
        </div>

        <button 
          type="submit"
          class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-3 px-6 rounded-lg hover:from-purple-700 hover:to-blue-700 transform hover:scale-105 transition duration-200 shadow-md"
        >
          จองเลย
        </button>
      </form>

      <!-- Message Display -->
      <p id="msg" class="mt-4 text-center font-medium"></p>
    </div>

    <!-- Navigation Links -->
    <div class="bg-white rounded-2xl shadow-lg p-6">
      <div class="flex flex-col sm:flex-row gap-4">
        <a 
          href="mybookings.html"
          class="flex-1 text-center bg-blue-500 text-white font-semibold py-3 px-6 rounded-lg hover:bg-blue-600 transition duration-200"
        >
          📋 ดูการจองของฉัน
        </a>
        <button 
          onclick="logout()"
          class="flex-1 bg-gray-500 text-white font-semibold py-3 px-6 rounded-lg hover:bg-gray-600 transition duration-200"
        >
          🚪 ออกจากระบบ
        </button>
      </div>
    </div>
  </div>
</body>
</html>
