<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</head>
<body class="bg-gradient-to-br from-purple-100 via-blue-100 to-pink-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <!-- Main Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 transform hover:scale-105 transition duration-300">
      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-block bg-gradient-to-r from-purple-500 to-blue-500 rounded-full p-4 mb-4">
          <span class="text-5xl">🎵</span>
        </div>
        <h2 class="text-3xl font-bold text-gray-800 mb-2">เข้าสู่ระบบ</h2>
        <p class="text-gray-600">ระบบจองห้องซ้อมดนตรี</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            📧 อีเมล
          </label>
          <input 
            type="email" 
            name="email" 
            id="email"
            placeholder="your@email.com" 
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 placeholder-gray-400"
          >
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            🔒 รหัสผ่าน
          </label>
          <input 
            type="password" 
            name="password" 
            id="password"
            placeholder="••••••••" 
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200 placeholder-gray-400"
          >
        </div>

        <button 
          type="submit"
          class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-3 px-6 rounded-lg hover:from-purple-700 hover:to-blue-700 transform hover:scale-105 transition duration-200 shadow-lg flex items-center justify-center"
        >
          <span id="btn-text">เข้าสู่ระบบ</span>
          <div id="loader" class="loader hidden ml-2">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </div>
        </button>
      </form>

      <!-- Footer -->
      <div class="mt-6 text-center">
        <p class="text-gray-600">
          ยังไม่มีบัญชี? 
          <a href="register.html" class="text-purple-600 hover:text-purple-700 font-semibold hover:underline transition duration-200">
            สมัครสมาชิก
          </a>
        </p>
      </div>
    </div>

    <!-- Additional Info -->
    <div class="text-center mt-6">
      <p class="text-gray-600 text-sm">
        🎸 จองห้องซ้อมได้ง่ายๆ ในไม่กี่คลิก
      </p>
    </div>
  </div>

  <style>
    /* Custom animation for card entrance */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body > div {
      animation: fadeInUp 0.6s ease-out;
    }
  </style>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btnText = document.getElementById("btn-text");
      const loader = document.getElementById("loader");
      const email = e.target.email.value;
      const password = e.target.password.value;

      // Show loading state
      btnText.textContent = "กำลังเข้าสู่ระบบ...";
      loader.classList.remove("hidden");

      try {
        const res = await apiRequest("/auth/login", "POST", { email, password });
        
        // Store token and user info
        if (res.token) {
          localStorage.setItem("token", res.token);
          localStorage.setItem("user", JSON.stringify(res.user));
          
          // Redirect based on role
          if (res.user.role === "admin") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "index.html";
          }
        }
      } catch (err) {
        // Reset button state
        btnText.textContent = "เข้าสู่ระบบ";
        loader.classList.add("hidden");
        
        alert("❌ " + (err.message || "เข้าสู่ระบบไม่สำเร็จ"));
      }
    });
  </script>
</body>
</html>
